            src="./images/slogan_image_2.png"

          <div class="card-content"></div>
          <div class="card-identity"><span class="card-name"></span> 敬上</div>
          <div class="send">
            <a class="send-link button" href="card.html">以電子郵件發送賀卡</a>

      <div class="bg-gold"></div>
