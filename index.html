<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>賀卡- 台灣博世舒適科技股份有限公司</title>
    <meta property="og:title" content="賀卡- 台灣博世舒適科技股份有限公司" />
    <meta property="og:image" content="./images/card.jpg" />
    <meta
      property="og:description"
      content="來自台灣博世舒適科技股份有限公司祝福"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="bg-card"></div>
    <div class="index">
      <div class="content">
        <!-- 1920x1080 設計稿舞台，座標直接對應 card.jpg -->
        <div class="items">
          <img class="item flower_top" src="./images/flower_top.png" />

          <img class="item goat" src="./images/goat.png" />
          <img class="item cloud cloud_03" src="./images/cloude_03.png" />
          <img class="item cloud cloud_02" src="./images/cloud_02.png" />
          <img class="item cloud cloud_01" src="./images/cloud_01.png" />

          <div class="item person">
            <img class="person_image" src="./images/person.png" />
          </div>

          <img class="item star star1" src="./images/star.svg" />
          <img class="item star star2" src="./images/star.svg" />
          <img class="item star star3" src="./images/star.svg" />

          <img class="item knot knot_right" src="./images/chinese_knot.png" />

          <img
            class="item slogan slogan_image_0"
            src="./images/slogan_image_0.png"
          />
          <img
            class="item slogan slogan_image_1"
            src="./images/slogan_image_1.png"
          />
          <img
            class="item slogan slogan_image_2"
            src="./images/slogan_image_2.png"
          />
          <img
            class="item slogan slogan_image_3"
            src="./images/slogan_image_3.png"
          />

          <img class="item light light1" src="./images/light.svg" />
          <img class="item light light2" src="./images/light.svg" />
          <img class="item light light3" src="./images/light.svg" />
          <img class="item light light4" src="./images/light.svg" />
          <img class="item light light5" src="./images/light.svg" />
          <img class="item light light6" src="./images/light.svg" />

          <div class="card card-html">
            <div class="card-content"></div>
            <div class="card-identity"><span class="card-name"></span> 敬上</div>
            <div class="send">
              <a class="send-link button" href="card.html">以電子郵件發送賀卡</a>
            </div>
          </div>
        </div>
        <!-- 燈籠固定貼齊視窗最左、最右 -->
        <div class="lantern_container">
          <img class="lantern lantern_left" src="./images/lantern_left.png" />
          <img class="knot knot_left" src="./images/chinese_knot.png" />
          <img class="lantern lantern_right" src="./images/lantern_right.png" />
        </div>
        <div class="logo_container">
          <a class="logo1" href="/">
            <img src="./images/logo1.png"  width="100%" height="100%"/>
          </a>
          <a class="logo2" href="/">
            <img src="./images/logo2.png"  width="100%" height="100%"/>
          </a>
          <a class="logo3" href="/">
            <img src="./images/logo3.png"  width="100%" height="100%"/>
          </a>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="./js/jquery.min.js"></script>
    <script src="./js/scripts.js"></script>
  </body>
</html>
