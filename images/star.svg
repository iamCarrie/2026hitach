<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 光芒：中心亮、往尖端漸淡 -->
    <radialGradient id="ray" cx="50" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe0" />
      <stop offset="0.35" stop-color="#ffe98f" stop-opacity="0.95" />
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow" cx="50" cy="50" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.4" stop-color="#fff4b0" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- 十字長光芒 -->
  <polygon points="2,50 50,47.6 98,50 50,52.4" fill="url(#ray)" />
  <polygon points="50,0 52.4,50 50,100 47.6,50" fill="url(#ray)" />
  <!-- 斜向短光芒 -->
  <g transform="rotate(45 50 50)" fill="url(#ray)">
    <polygon points="16,50 50,49 84,50 50,51" />
    <polygon points="50,16 51,50 50,84 49,50" />
  </g>
  <circle cx="50" cy="50" r="14" fill="url(#glow)" />
</svg>
